<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Blog | Jayr Santos Psicanalista</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../../assets/favicon-jayr-santos-psicanalista.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #F7F5F0;
      color: #2A2E33;
      min-height: 100vh;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    h1, h2 { font-family: 'Playfair Display', serif; color: #1B3A5C; }

    /* Login */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }
    .login-box h1 { font-size: 1.5rem; margin: 0 0 24px; text-align: center; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 12px; border: 1px solid #CCC; border-radius: 6px;
      font-family: inherit; font-size: 1rem;
    }
    .field textarea { min-height: 200px; resize: vertical; font-family: monospace; font-size: 0.9rem; }
    .btn {
      background: #1B3A5C; color: #fff; border: none; padding: 12px 24px;
      font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2C5E93; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn--danger { background: #b23a3a; }
    .btn--danger:hover { background: #8f2e2e; }
    .btn--ghost { background: transparent; color: #1B3A5C; border: 1px solid #1B3A5C; }
    .error-msg { color: #b23a3a; font-size: 0.9rem; margin-top: 10px; text-align: center; }

    /* Painel */
    #panel-screen { display: none; }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 2px solid #E8DFD2; }
    .tab-btn {
      background: none; border: none; padding: 10px 18px; font-weight: 600;
      color: #8FA68E; cursor: pointer; border-bottom: 3px solid transparent; font-size: 0.95rem;
    }
    .tab-btn.active { color: #1B3A5C; border-bottom-color: #1B3A5C; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .post-list { display: grid; gap: 12px; }
    .post-row {
      background: #fff; border-radius: 8px; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .post-row__info strong { display: block; color: #1B3A5C; }
    .post-row__meta { font-size: 0.85rem; color: #8FA68E; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge--publicado { background: #8FA68E; color: #fff; }
    .badge--rascunho { background: #ddd; color: #555; }
    .post-row__actions { display: flex; gap: 8px; }
    .post-row__actions button { padding: 8px 14px; font-size: 0.85rem; }

    .editor-box { background: #fff; border-radius: 8px; padding: 28px; }
    .editor-grid { display: grid; gap: 18px; }
    .editor-actions { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }

    .comment-row {
      background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .comment-row__top { font-size: 0.85rem; color: #8FA68E; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .comment-row__contato {
      display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 10px 12px;
      background: #F7F5F0; border-radius: 6px; font-size: 0.88rem; margin-bottom: 10px;
    }
    .comment-row__contato-item strong { color: #1B3A5C; }
    .comment-row__contato-item a { color: #2C5E93; word-break: break-all; }
    .comment-row__texto { margin: 8px 0; }
    .comment-row__actions { display: flex; gap: 8px; }
    .comment-row__reply-tag { display: inline-block; margin-left: 6px; font-style: italic; color: #2C5E93; }

    .empty-state { color: #8FA68E; padding: 20px 0; }
    #image-preview { max-width: 200px; border-radius: 6px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <!-- ===== TELA DE LOGIN ===== -->
  <div id="login-screen">
    <div class="login-box">
      <h1>Painel do Blog</h1>
      <form id="login-form">
        <div class="field">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" style="width:100%;">Entrar</button>
        <p id="login-error" class="error-msg" hidden></p>
      </form>
    </div>
  </div>

  <!-- ===== PAINEL ===== -->
  <div id="panel-screen">
    <div class="wrap">
      <div class="panel-header">
        <h1 style="margin:0; font-size:1.6rem;">Painel do Blog</h1>
        <button class="btn btn--ghost" id="logout-btn">Sair</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="posts">Artigos</button>
        <button class="tab-btn" data-tab="novo">Novo Artigo</button>
        <button class="tab-btn" data-tab="comentarios">Comentários</button>
      </div>

      <!-- Aba: lista de posts -->
      <div class="tab-panel active" id="tab-posts">
        <div id="posts-list" class="post-list"><p class="empty-state">Carregando...</p></div>
      </div>

      <!-- Aba: novo/editar post -->
      <div class="tab-panel" id="tab-novo">
        <div class="editor-box">
          <h2 id="editor-title" style="margin-top:0; font-size:1.2rem;">Novo artigo</h2>
          <form id="post-form" class="editor-grid">
            <input type="hidden" id="post-id" value="" />
            <div class="field">
              <label for="post-titulo">Título</label>
              <input type="text" id="post-titulo" required />
            </div>
            <div class="field">
              <label for="post-slug">Slug (URL amigável, opcional)</label>
              <input type="text" id="post-slug" placeholder="gerado automaticamente a partir do título" />
            </div>
            <div class="field">
              <label for="post-descricao">Resumo (SEO)</label>
              <input type="text" id="post-descricao" maxlength="200" placeholder="1-2 frases para o Google e para o card do blog" />
            </div>
            <div class="field">
              <label for="post-tag">Categoria</label>
              <select id="post-tag">
                <option value="Saúde Mental e Emoções">Saúde Mental e Emoções</option>
                <option value="Família e Relacionamentos">Família e Relacionamentos</option>
                <option value="Sociedade e Comportamentos">Sociedade e Comportamentos</option>
                <option value="Trabalho e Vida Profissional">Trabalho e Vida Profissional</option>
                <option value="Fé e Espiritualidade">Fé e Espiritualidade</option>
                <option value="Feminilidade">Feminilidade</option>
                <option value="Masculinidade">Masculinidade</option>
              </select>
            </div>
            <div class="field">
              <label for="post-capa">Imagem de capa</label>
              <input type="file" id="post-capa" accept="image/*" />
              <input type="hidden" id="post-capa-url" />
              <img id="image-preview" alt="Pré-visualização da capa" />
            </div>
            <div class="field">
              <label for="post-corpo">Conteúdo (Markdown: ## títulos, **negrito**, *itálico*, listas com - ou 1., > citação)</label>
              <textarea id="post-corpo" required></textarea>
            </div>
            <div class="editor-actions">
              <button type="submit" class="btn" data-status="publicado">Publicar</button>
              <button type="submit" class="btn btn--ghost" data-status="rascunho">Salvar como rascunho</button>
              <button type="button" class="btn btn--ghost" id="cancel-edit-btn" hidden>Cancelar edição</button>
            </div>
            <p id="post-feedback" class="error-msg" hidden></p>
          </form>
        </div>
      </div>

      <!-- Aba: comentários -->
      <div class="tab-panel" id="tab-comentarios">
        <div id="comments-admin-list"><p class="empty-state">Carregando...</p></div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
